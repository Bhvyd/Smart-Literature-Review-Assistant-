[project]
name = "litreview"
version = "0.1.0"
description = "Smart Literature Review Assistant using LLMs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
models = [
    "torch>=2.2",
    "transformers>=4.40,<5",
    "adapters>=1.0",
    "sentencepiece>=0.2",
]
ml = [
    "numpy>=2.0",
    "scipy>=1.11",
    "umap-learn>=0.5",
    "hdbscan>=0.8.33",
    "scikit-learn>=1.5",
    "networkx>=3.3",
]
eval = ["faiss-cpu>=1.8", "rouge-score>=0.1.2", "bert-score>=0.3.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
